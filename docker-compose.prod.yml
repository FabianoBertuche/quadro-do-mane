# Monte Moria — Docker Compose for Production
# Uses the existing mm-postgres container and restored database.
# Temporary direct-IP access: web on :3000 and API on :3001.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mm-api
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: "postgresql://postgres:ChangeThisPassword123!@mm-postgres:5432/quadro_do_mane?schema=public"
      NEXT_PUBLIC_API_URL: "http://2.25.105.206:3001/api"
      COOKIE_DOMAIN: "2.25.105.206"
      COOKIE_SECURE: "false"
    networks:
      - quadro_net
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const http=require('http');
          http.get('http://localhost:3001/api/auth/me',r=>process.exit(r.statusCode===401||r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mm-web
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://2.25.105.206:3001/api"
      API_BACKEND_URL: "http://mm-api:3001"
    networks:
      - quadro_net
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mm-migrate
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:ChangeThisPassword123!@mm-postgres:5432/quadro_do_mane?schema=public"
    networks:
      - quadro_net
    entrypoint:
      - sh
      - -c
      - cd apps/api && npx prisma migrate deploy --schema=prisma/schema.prisma && echo 'Migrations applied successfully'
    restart: "no"

networks:
  quadro_net:
    external: true
    name: quadro-do-mane_default
