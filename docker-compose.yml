# Monte Moria — Docker Compose (Production)

services:
  caddy:
    image: caddy:2-alpine
    container_name: quadro-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    container_name: quadro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quadro_do_mane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quadro_do_mane"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: quadro-api
    env_file: .env.docker
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: quadro-web
    env_file: .env.docker
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    name: quadro-network

volumes:
  postgres_data:
  caddy_data:
  caddy_config: