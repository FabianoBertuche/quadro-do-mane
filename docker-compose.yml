# Monte Moria — Docker Compose for Development
# This file mirrors the production setup minimum: Postgres only for dev,
# but includes all services (API, Web) for completeness.

services:
  postgres:
    image: postgres:16-alpine
    container_name: quadro-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: quadro_do_mane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quadro_do_mane"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: quadro-api
    ports:
      - '3001:3001'
    env_file: .env.docker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=${NODE_ENV}
      - API_PORT=${API_PORT}
    depends_on:
      postgres:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: quadro-web
    ports:
      - '3000:3000'
    env_file: .env.docker
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data: